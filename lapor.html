<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lapor Masalah - ManajerKost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div class="max-w-2xl mx-auto px-6 py-12">
            <h1 class="text-3xl font-bold text-gray-900">Lapor Masalah Kost</h1>
            <p class="text-gray-500 mt-2 mb-8">Sampaikan kendala fasilitas agar pemilik kost dapat segera menindaklanjutinya.</p>

            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
                <div id="report-success" class="hidden mb-6 p-4 bg-green-50 text-green-700 rounded-xl border border-green-200 text-sm font-medium">
                    Laporan masalah berhasil dikirim ke pemilik kost!
                </div>

                <form id="report-form" class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Pilih Kost</label>
                        <select id="kost_id" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-primary focus:ring focus:ring-primary/20 outline-none"></select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Judul Keluhan</label>
                        <input type="text" id="title" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-primary focus:ring focus:ring-primary/20 outline-none" placeholder="Contoh: Keran Air Kamar Mandi Bocor">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">Detail Masalah</label>
                        <textarea id="description" rows="4" required class="w-full border border-gray-300 rounded-lg p-3 focus:border-primary focus:ring focus:ring-primary/20 outline-none" placeholder="Jelaskan kronologi atau lokasi kerusakan..."></textarea>
                    </div>

                    <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-500/20">
                        Kirim Laporan
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        const user = ManajerKostDB.getCurrentUser();
        if (!user) {
            window.location.href = 'login.html';
        }
        ManajerKostDB.renderNavbar();

        const select = document.getElementById('kost_id');
        ManajerKostDB.getKosts().forEach(k => {
            const opt = document.createElement('option');
            opt.value = k.id;
            opt.textContent = `${k.name} (${k.location})`;
            select.appendChild(opt);
        });

        document.getElementById('report-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const reports = ManajerKostDB.getReports();
            reports.unshift({
                id: Date.now(),
                kost_id: parseInt(select.value, 10),
                user_id: user.id,
                title: document.getElementById('title').value.trim(),
                description: document.getElementById('description').value.trim(),
                status: 'pending',
                created_at: new Date().toISOString()
            });
            ManajerKostDB.saveReports(reports);

            this.reset();
            document.getElementById('report-success').classList.remove('hidden');
        });
    </script>
</body>
</html>
