<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ManajerKost - Marketplace Kost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>
        html { scroll-behavior: smooth; }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased selection:bg-orange-100 selection:text-orange-600 flex flex-col min-h-screen">

    <nav x-data="{ scrolled: false }" 
         @scroll.window="scrolled = (window.pageYOffset > 20)"
         :class="scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-3' : 'bg-white py-4 shadow-sm'"
         class="fixed top-0 w-full z-50 transition-all duration-300 ease-in-out">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div class="relative bg-gradient-to-b from-orange-50 to-white pt-20 pb-20 px-6 rounded-b-[3rem]">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-5xl font-extrabold text-gray-900 mb-6 leading-tight tracking-tight">
                    Cari Kost Nyaman, <br>
                    <span class="text-primary bg-orange-100 px-2 rounded-lg rotate-1 inline-block border border-orange-200">Hidup Aman</span>
                </h1>
                <p class="text-lg text-gray-500 mb-10 max-w-2xl mx-auto">
                    Temukan tempat tinggal impianmu atau sewakan kost dengan mudah bersama ManajerKost. 
                    Dilengkapi fitur pelaporan masalah yang transparan.
                </p>
                
                <div id="hero-actions" class="flex justify-center gap-4 flex-wrap"></div>
            </div>
        </div>

        <div id="rekomendasi" class="max-w-7xl mx-auto px-6 mt-16 mb-20">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-2xl font-bold text-gray-900">Rekomendasi Kost</h2>
                    <p class="text-gray-500 mt-1">Pilihan terbaik minggu ini</p>
                </div>
            </div>
            
            <div id="kost-list" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        ManajerKostDB.renderNavbar();

        const user = ManajerKostDB.getCurrentUser();
        const heroActions = document.getElementById('hero-actions');
        let sewakanBtn = '';

        if (user && user.role === 'owner') {
            sewakanBtn = `
                <a href="owner-dashboard.html" class="px-8 py-4 bg-white text-gray-700 border border-gray-200 font-bold rounded-full hover:bg-gray-50 hover:border-gray-300 transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Sewakan Kost (Dashboard)
                </a>`;
        } else if (user && user.role === 'user') {
            sewakanBtn = `
                <button class="px-8 py-4 bg-gray-100 text-gray-400 border border-gray-200 font-bold rounded-full cursor-not-allowed" title="Anda login sebagai Pencari Kost">
                    Sewakan Kost
                </button>`;
        } else {
            sewakanBtn = `
                <a href="register.html" class="px-8 py-4 bg-white text-gray-700 border border-gray-200 font-bold rounded-full hover:bg-gray-50 hover:border-gray-300 transition flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    Sewakan Kost
                </a>`;
        }

        heroActions.innerHTML = `
            <a href="#rekomendasi" class="px-8 py-4 bg-primary text-white font-bold rounded-full shadow-xl shadow-orange-500/30 hover:bg-orange-600 hover:scale-105 transition transform duration-200 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                </svg>
                Cari Kost
            </a>
            ${sewakanBtn}
        `;

        const kostList = document.getElementById('kost-list');
        const kosts = ManajerKostDB.getKosts().filter(k => k.is_available);

        if (kosts.length === 0) {
            kostList.innerHTML = `
                <div class="col-span-3 text-center py-20 bg-gray-50 rounded-3xl border border-dashed border-gray-300">
                    <p class="text-gray-400 text-lg">Belum ada kost yang tersedia saat ini.</p>
                </div>`;
        } else {
            kostList.innerHTML = kosts.map(kost => {
                const coverHtml = kost.image
                    ? `<img src="${kost.image}" alt="${kost.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`
                    : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" /></svg>`;

                return `
                    <div class="group bg-white rounded-2xl shadow-sm hover:shadow-xl border border-gray-100 transition duration-300 overflow-hidden flex flex-col h-full">
                        <div class="h-56 bg-gray-100 relative flex items-center justify-center text-gray-300 group-hover:bg-orange-50 transition overflow-hidden">
                            ${coverHtml}
                            <div class="absolute top-4 right-4 bg-white/90 backdrop-blur text-xs font-bold px-3 py-1 rounded-full shadow-sm text-gray-700">
                                ${kost.is_available ? 'Tersedia' : 'Penuh'}
                            </div>
                        </div>
                        <div class="p-5 flex flex-col flex-grow">
                            <div class="flex-grow">
                                <h3 class="font-bold text-lg text-gray-900 group-hover:text-primary transition line-clamp-1">
                                    <a href="kost-detail.html?slug=${kost.slug}">${kost.name}</a>
                                </h3>
                                <p class="text-sm text-gray-500 mt-2 flex items-center gap-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" /></svg>
                                    ${kost.location}
                                </p>
                                <p class="text-sm text-gray-400 mt-3 line-clamp-2">${kost.description}</p>
                            </div>
                            <div class="mt-6 pt-4 border-t border-gray-50 flex items-center justify-between">
                                <p class="text-primary font-bold text-lg">Rp ${ManajerKostDB.formatRupiah(kost.price)} <span class="text-xs text-gray-400 font-normal">/bln</span></p>
                                <a href="kost-detail.html?slug=${kost.slug}" class="text-gray-400 hover:text-primary transition">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
