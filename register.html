<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - ManajerKost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-lg border border-orange-100">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Buat Akun Baru</h2>
            <p class="text-center text-gray-500 text-sm mb-6">Bergabunglah dengan komunitas ManajerKost</p>

            <div id="error-box" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4 text-sm"></div>

            <form id="register-form" class="space-y-5" x-data="{ role: 'user' }">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="name" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="Nama Lengkap Anda">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Alamat Email</label>
                    <input type="email" id="email" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="nama@email.com">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Nomor WhatsApp</label>
                    <input type="text" id="phone" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition" placeholder="0812xxxx">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Saya mendaftar sebagai:</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="role" value="user" class="peer sr-only" x-model="role">
                            <div class="p-4 rounded-xl border-2 text-center transition-all duration-200"
                                 :class="role === 'user' ? 'border-primary bg-orange-50 text-primary' : 'border-gray-200 hover:border-orange-200'">
                                <div class="font-bold text-sm">Pencari Kos</div>
                            </div>
                            <div x-show="role === 'user'" class="absolute top-2 right-2 text-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" /></svg>
                            </div>
                        </label>

                        <label class="cursor-pointer relative">
                            <input type="radio" name="role" value="owner" class="peer sr-only" x-model="role">
                            <div class="p-4 rounded-xl border-2 text-center transition-all duration-200"
                                 :class="role === 'owner' ? 'border-primary bg-orange-50 text-primary' : 'border-gray-200 hover:border-orange-200'">
                                <div class="font-bold text-sm">Pemilik Kos</div>
                            </div>
                            <div x-show="role === 'owner'" class="absolute top-2 right-2 text-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" /></svg>
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" required minlength="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Ulangi Password</label>
                    <input type="password" id="password_confirmation" required minlength="6" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition">
                </div>

                <button type="submit" class="w-full bg-gray-900 text-white py-3 rounded-lg font-bold hover:bg-primary transition shadow-lg shadow-orange-500/20">
                    Daftar Sekarang
                </button>
            </form>

            <p class="text-center text-sm text-gray-600 mt-6">
                Sudah punya akun? <a href="login.html" class="text-primary font-bold hover:underline">Login disini</a>
            </p>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        if (ManajerKostDB.getCurrentUser()) {
            window.location.href = 'index.html';
        }
        ManajerKostDB.renderNavbar();

        document.getElementById('register-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const role = document.querySelector('input[name="role"]:checked').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('password_confirmation').value;
            const errBox = document.getElementById('error-box');

            const users = ManajerKostDB.getUsers();
            if (users.some(u => u.email === email)) {
                errBox.textContent = '• Email sudah terdaftar.';
                errBox.classList.remove('hidden');
                return;
            }
            if (password !== confirm) {
                errBox.textContent = '• Konfirmasi password tidak cocok.';
                errBox.classList.remove('hidden');
                return;
            }

            const newUser = {
                id: Date.now(),
                name,
                email,
                phone,
                role,
                password
            };

            users.push(newUser);
            ManajerKostDB.saveUsers(users);
            ManajerKostDB.setCurrentUser(newUser);
            window.location.href = role === 'owner' ? 'owner-dashboard.html' : 'index.html';
        });
    </script>
</body>
</html>
