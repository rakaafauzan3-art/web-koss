<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemilik - ManajerKost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div class="max-w-7xl mx-auto px-6 py-10">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-10">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">Dashboard Pemilik</h1>
                    <p class="text-gray-500 mt-2">Kelola properti dan pantau calon penghuni Anda.</p>
                </div>
                <a href="owner-create.html" class="flex items-center gap-2 bg-gray-900 text-white px-5 py-3 rounded-lg font-semibold hover:bg-primary transition shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                    </svg>
                    Tambah Kos Baru
                </a>
            </div>

            <div id="delete-alert" class="hidden mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm font-medium">
                Profil kos berhasil dihapus.
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div class="lg:col-span-2 space-y-6">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-primary">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                        </svg>
                        Properti Saya
                    </h2>
                    <div id="my-kosts-list" class="space-y-4"></div>
                </div>

                <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm h-fit">
                    <h2 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-red-500">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0" />
                        </svg>
                        Permintaan Sewa Baru
                    </h2>
                    <div id="incoming-requests-list" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        const user = ManajerKostDB.getCurrentUser();
        if (!user || user.role !== 'owner') {
            window.location.href = 'login.html';
        }
        ManajerKostDB.renderNavbar();

        function renderDashboard() {
            const myKosts = ManajerKostDB.getKosts().filter(k => k.user_id === user.id);
            const myKostIds = myKosts.map(k => k.id);
            const allUsers = ManajerKostDB.getUsers();
            const incomingRequests = ManajerKostDB.getRequests().filter(r => myKostIds.includes(r.kost_id));

            const kostContainer = document.getElementById('my-kosts-list');
            if (myKosts.length === 0) {
                kostContainer.innerHTML = `
                    <div class="text-center py-10 bg-gray-50 rounded-2xl border border-dashed border-gray-300">
                        <p class="text-gray-500">Belum ada properti yang ditambahkan.</p>
                    </div>`;
            } else {
                kostContainer.innerHTML = myKosts.map(kost => {
                    const thumbHtml = kost.image
                        ? `<img src="${kost.image}" alt="${kost.name}" class="h-16 w-16 rounded-lg object-cover border border-gray-200 flex-shrink-0">`
                        : `<div class="h-16 w-16 bg-gray-100 rounded-lg flex items-center justify-center text-gray-400 flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                            </svg>
                           </div>`;

                    return `
                        <div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm hover:shadow-md transition flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 group">
                            <div class="flex gap-4 items-center">
                                ${thumbHtml}
                                <div>
                                    <h3 class="font-bold text-lg text-gray-900">${kost.name}</h3>
                                    <p class="text-sm text-gray-500">${kost.location} • Rp ${ManajerKostDB.formatRupiah(kost.price)}</p>
                                    ${kost.contact_phone ? `<p class="text-xs text-gray-400 mt-1">HP: ${kost.contact_phone}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-2 self-end sm:self-center">
                                <a href="owner-manage.html?id=${kost.id}" class="px-4 py-2 bg-orange-50 text-primary font-medium rounded-lg hover:bg-primary hover:text-white transition">
                                    Kelola
                                </a>
                                <button type="button" onclick="confirmDeleteKost(${kost.id}, '${kost.name.replace(/'/g, "\\'")}')" class="px-3.5 py-2 bg-red-50 text-red-600 font-medium rounded-lg hover:bg-red-600 hover:text-white transition flex items-center gap-1" title="Hapus Profil Kos">
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" class="w-4 h-4">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                                    </svg>
                                    Hapus
                                </button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            const reqContainer = document.getElementById('incoming-requests-list');
            if (incomingRequests.length === 0) {
                reqContainer.innerHTML = `<p class="text-sm text-gray-400 text-center py-4">Belum ada permintaan sewa baru.</p>`;
            } else {
                reqContainer.innerHTML = incomingRequests.map(req => {
                    const tenant = allUsers.find(u => u.id === req.user_id) || { name: 'Calon Penghuni', phone: '-' };
                    const kost = myKosts.find(k => k.id === req.kost_id) || { name: 'Kost' };
                    const waPhone = ManajerKostDB.formatWaNumber(tenant.phone);
                    return `
                        <div class="border-b border-gray-50 pb-4 last:border-0 last:pb-0">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-bold px-2 py-1 rounded bg-blue-50 text-blue-600">${kost.name}</span>
                                <span class="text-xs text-gray-400">${ManajerKostDB.timeAgo(req.created_at)}</span>
                            </div>
                            <div class="flex items-start gap-3">
                                <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center font-bold text-gray-500">
                                    ${tenant.name.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <p class="font-bold text-sm text-gray-800">${tenant.name}</p>
                                    <a href="https://wa.me/${waPhone}" target="_blank" class="text-xs text-green-600 hover:underline flex items-center gap-1 mt-1">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-3 h-3"><path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" /><path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" /></svg>
                                        ${tenant.phone}
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        function confirmDeleteKost(kostId, kostName) {
            if (confirm(`Apakah Anda yakin ingin menghapus profil kos "${kostName}"?`)) {
                ManajerKostDB.deleteKost(kostId);
                renderDashboard();
                const alertBox = document.getElementById('delete-alert');
                alertBox.classList.remove('hidden');
                setTimeout(() => alertBox.classList.add('hidden'), 3000);
            }
        }

        renderDashboard();
    </script>
</body>
</html>
