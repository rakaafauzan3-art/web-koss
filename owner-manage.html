<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Kost - ManajerKost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div class="max-w-6xl mx-auto px-6 py-10" x-data="{ activeTab: 'info' }">
            <div class="mb-8 border-b border-gray-200 pb-8">
                <a href="owner-dashboard.html" class="text-sm text-gray-500 hover:text-primary mb-4 block">&larr; Kembali ke Dashboard</a>
                <div class="flex flex-col sm:flex-row justify-between items-start gap-4">
                    <div class="flex items-center gap-4">
                        <div id="kost-thumb" class="w-20 h-20 rounded-xl bg-gray-100 border border-gray-200 flex items-center justify-center text-gray-400 overflow-hidden flex-shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                            </svg>
                        </div>
                        <div>
                            <h1 id="kost-name" class="text-3xl font-bold text-gray-900">Memuat...</h1>
                            <p id="kost-address" class="text-gray-500 mt-1"></p>
                            <p id="kost-phone" class="text-sm text-gray-600 mt-1 font-medium"></p>
                        </div>
                    </div>
                    <div class="bg-green-100 text-green-700 px-3 py-1 rounded text-sm font-bold">
                        Tersedia
                    </div>
                </div>
            </div>

            <div class="flex gap-6 border-b border-gray-200 mb-8">
                <button @click="activeTab = 'info'" 
                        class="pb-4 text-sm font-semibold transition border-b-2"
                        :class="activeTab === 'info' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'">
                    Informasi Detail
                </button>
                <button @click="activeTab = 'reports'" 
                        class="pb-4 text-sm font-semibold transition border-b-2 flex items-center gap-2"
                        :class="activeTab === 'reports' ? 'border-primary text-primary' : 'border-transparent text-gray-500 hover:text-gray-700'">
                    Laporan Masalah
                    <span id="report-count" class="bg-red-100 text-red-600 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <div x-show="activeTab === 'info'" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
                    <h3 class="font-bold text-gray-800">Statistik Penghuni</h3>
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                        <span class="text-gray-600">Total Kamar</span>
                        <span id="total-rooms" class="font-bold">10</span>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                        <span class="text-gray-600">Terisi</span>
                        <span id="occupied-rooms" class="font-bold text-primary">0</span>
                    </div>
                    <div class="pt-4 border-t border-gray-100">
                        <label class="block text-sm font-bold text-gray-700 mb-2">Perbarui Foto Profil Kost</label>
                        <input type="file" id="update-photo-input" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-orange-50 file:text-primary hover:file:bg-orange-100 cursor-pointer">
                        <p id="photo-msg" class="hidden text-xs text-green-600 font-semibold mt-2">Foto profil kost berhasil diperbarui!</p>
                    </div>
                </div>
                
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                    <h3 class="font-bold text-gray-800 mb-4">Pengumuman Kos</h3>
                    <textarea id="announcement-input" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:ring-primary focus:border-primary outline-none" rows="4" placeholder="Tulis pengumuman untuk penghuni disini..."></textarea>
                    <button onclick="saveAnnouncement()" class="mt-3 bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-primary transition w-full">Update Pengumuman</button>
                    <p id="announcement-msg" class="hidden text-xs text-green-600 font-semibold mt-2 text-center">Pengumuman berhasil diperbarui!</p>
                </div>
            </div>

            <div x-show="activeTab === 'reports'" x-cloak id="reports-container"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        const user = ManajerKostDB.getCurrentUser();
        if (!user || user.role !== 'owner') {
            window.location.href = 'login.html';
        }
        ManajerKostDB.renderNavbar();

        const params = new URLSearchParams(window.location.search);
        const kostId = parseInt(params.get('id'), 10);
        const kosts = ManajerKostDB.getKosts();
        const kost = kosts.find(k => k.id === kostId && k.user_id === user.id) || kosts.find(k => k.user_id === user.id);

        if (!kost) {
            window.location.href = 'owner-dashboard.html';
        } else {
            if (kost.image) {
                document.getElementById('kost-thumb').innerHTML = `<img src="${kost.image}" alt="${kost.name}" class="w-full h-full object-cover">`;
            }
            document.getElementById('kost-name').textContent = kost.name;
            document.getElementById('kost-address').textContent = kost.address;
            document.getElementById('kost-phone').textContent = kost.contact_phone ? `Nomor Kontak: ${kost.contact_phone}` : '';
            document.getElementById('total-rooms').textContent = kost.total_rooms || 10;
            document.getElementById('occupied-rooms').textContent = kost.occupied_rooms || 0;
            document.getElementById('announcement-input').value = kost.announcement || '';

            const allUsers = ManajerKostDB.getUsers();
            const reports = ManajerKostDB.getReports().filter(r => r.kost_id === kost.id);
            document.getElementById('report-count').textContent = reports.length;

            const repContainer = document.getElementById('reports-container');
            if (reports.length === 0) {
                repContainer.innerHTML = `
                    <div class="text-center py-16 bg-gray-50 rounded-2xl">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mx-auto text-gray-300 mb-3">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <p class="text-gray-500">Tidak ada laporan masalah saat ini. Bagus!</p>
                    </div>`;
            } else {
                repContainer.innerHTML = reports.map(report => {
                    const reporter = allUsers.find(u => u.id === report.user_id) || { name: 'Penghuni' };
                    return `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-4">
                            <div class="flex justify-between items-start mb-2">
                                <span class="px-2 py-1 rounded bg-red-50 text-red-600 text-xs font-bold uppercase">${report.title}</span>
                                <span class="text-xs text-gray-400">${ManajerKostDB.timeAgo(report.created_at)}</span>
                            </div>
                            <p class="text-gray-700 mb-4">${report.description}</p>
                            <div class="flex items-center gap-2 border-t border-gray-50 pt-4">
                                <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs font-bold text-gray-500">
                                    ${reporter.name.charAt(0).toUpperCase()}
                                </div>
                                <span class="text-sm text-gray-500">Dilaporkan oleh ${reporter.name}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }
        }

        document.getElementById('update-photo-input').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            try {
                const compressed = await ManajerKostDB.compressImage(file);
                const list = ManajerKostDB.getKosts();
                const idx = list.findIndex(k => k.id === kost.id);
                if (idx !== -1) {
                    list[idx].image = compressed;
                    if (ManajerKostDB.saveKosts(list)) {
                        document.getElementById('kost-thumb').innerHTML = `<img src="${compressed}" alt="${kost.name}" class="w-full h-full object-cover">`;
                        const msg = document.getElementById('photo-msg');
                        msg.classList.remove('hidden');
                        setTimeout(() => msg.classList.add('hidden'), 2500);
                    }
                }
            } catch (err) {
                alert('Gagal memperbarui foto.');
            }
        });

        function saveAnnouncement() {
            const val = document.getElementById('announcement-input').value;
            const list = ManajerKostDB.getKosts();
            const idx = list.findIndex(k => k.id === kost.id);
            if (idx !== -1) {
                list[idx].announcement = val;
                ManajerKostDB.saveKosts(list);
                const msg = document.getElementById('announcement-msg');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 2500);
            }
        }
    </script>
</body>
</html>
