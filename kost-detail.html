<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Kost - ManajerKost</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { primary: '#f97316', secondary: '#fff7ed' }
                }
            }
        }
    </script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-50 font-sans text-gray-900 antialiased flex flex-col min-h-screen">

    <nav class="fixed top-0 w-full z-50 bg-white py-4 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="p-2 bg-primary rounded-lg text-white group-hover:bg-orange-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-gray-800 tracking-tight">Manajer<span class="text-primary">Kost</span></span>
            </a>
            <div id="navbar-links" class="flex items-center gap-8"></div>
        </div>
    </nav>

    <main class="flex-grow pt-20">
        <div id="kost-cover-banner" class="h-72 bg-gray-200 w-full relative overflow-hidden">
            <div class="absolute inset-0 flex items-center justify-center text-gray-400">
                <span class="flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    Foto Cover Kost
                </span>
            </div>
        </div>

        <div class="max-w-4xl mx-auto px-6 -mt-10 relative z-10">
            <div id="kost-detail-card" class="bg-white p-8 rounded-2xl shadow-xl border border-gray-100"></div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 pt-16 pb-8 mt-20">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="text-gray-400 text-sm">&copy; 2025 ManajerKost. Dibuat dengan HTML &amp; Tailwind CSS.</p>
        </div>
    </footer>

    <script src="app.js"></script>
    <script>
        ManajerKostDB.renderNavbar();

        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug');
        const kosts = ManajerKostDB.getKosts();
        const kost = kosts.find(k => k.slug === slug) || kosts[0];
        const user = ManajerKostDB.getCurrentUser();
        const card = document.getElementById('kost-detail-card');
        const banner = document.getElementById('kost-cover-banner');

        if (!kost) {
            card.innerHTML = `<p class="text-center text-gray-500">Data kost tidak ditemukan. <a href="index.html" class="text-primary underline">Kembali ke beranda</a></p>`;
        } else {
            document.title = `${kost.name} - ManajerKost`;

            if (kost.image) {
                banner.innerHTML = `<img src="${kost.image}" alt="${kost.name}" class="w-full h-full object-cover">`;
            }

            const contactPhone = kost.contact_phone || '-';
            const waNumber = ManajerKostDB.formatWaNumber(kost.contact_phone);
            const waButton = waNumber
                ? `<a href="https://wa.me/${waNumber}?text=${encodeURIComponent('Halo, saya tertarik dengan ' + kost.name + ' di ManajerKost.')}" target="_blank" class="w-full md:w-auto bg-green-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-green-700 transition shadow-lg shadow-green-500/20 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z" />
                    </svg>
                    WhatsApp (${contactPhone})
                </a>`
                : '';

            let actionHtml = '';
            if (user && user.role === 'owner') {
                actionHtml = `
                    <div class="bg-orange-50 text-orange-800 p-4 rounded-lg text-center font-medium border border-orange-200">
                        Anda login sebagai Pemilik Kos. Silakan gunakan akun Penghuni untuk menyewa.
                    </div>`;
            } else if (user) {
                actionHtml = `
                    <div class="flex flex-wrap gap-3">
                        <button onclick="requestRent(${kost.id})" class="w-full md:w-auto bg-primary text-white px-8 py-3 rounded-xl font-bold hover:bg-orange-600 transition shadow-lg shadow-orange-500/30 flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 01-.825-.242m9.345-8.334a2.126 2.126 0 00-.476-.095 48.64 48.64 0 00-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0011.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
                            </svg>
                            Ajukan Sewa
                        </button>
                        ${waButton}
                    </div>`;
            } else {
                actionHtml = `
                    <div class="flex flex-col sm:flex-row gap-3">
                        <a href="login.html" class="flex-1 text-center bg-gray-900 text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-800 transition">
                            Masuk untuk Menyewa
                        </a>
                        ${waButton}
                    </div>`;
            }

            card.innerHTML = `
                <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900">${kost.name}</h1>
                        <p class="text-gray-500 mt-1 flex items-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                            </svg>
                            ${kost.location}
                        </p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-bold text-primary">Rp ${ManajerKostDB.formatRupiah(kost.price)}</p>
                        <p class="text-sm text-gray-400">per bulan</p>
                    </div>
                </div>

                <hr class="my-6 border-gray-100">

                <div class="prose max-w-none text-gray-700">
                    <h3 class="font-bold text-lg mb-2">Deskripsi</h3>
                    <p>${kost.description}</p>
                    
                    <h3 class="font-bold text-lg mt-6 mb-2">Alamat Lengkap</h3>
                    <p>${kost.address}</p>

                    <h3 class="font-bold text-lg mt-6 mb-2">Nomor Handphone yang Bisa Dihubungi</h3>
                    <p class="text-gray-800 font-semibold">${contactPhone}</p>
                </div>

                <div class="mt-10">
                    ${actionHtml}
                    <div id="rent-feedback" class="hidden mt-4 p-4 rounded-lg text-center border"></div>
                </div>
            `;
        }

        function requestRent(kostId) {
            const currentUser = ManajerKostDB.getCurrentUser();
            const feedback = document.getElementById('rent-feedback');
            const requests = ManajerKostDB.getRequests();
            const existing = requests.find(r => r.kost_id === kostId && r.user_id === currentUser.id);

            feedback.classList.remove('hidden', 'bg-green-50', 'text-green-700', 'border-green-200', 'bg-blue-50', 'text-blue-700', 'border-blue-200');

            if (existing) {
                feedback.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-200');
                feedback.textContent = 'Anda sudah mengirim permintaan sebelumnya.';
                return;
            }

            requests.unshift({
                id: Date.now(),
                kost_id: kostId,
                user_id: currentUser.id,
                status: 'pending',
                created_at: new Date().toISOString()
            });
            ManajerKostDB.saveRequests(requests);

            feedback.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            feedback.textContent = 'Permintaan terkirim! Pemilik akan menghubungi Anda.';
        }
    </script>
</body>
</html>
